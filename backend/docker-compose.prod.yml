version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: arcturus
      POSTGRES_PASSWORD: LegoDatabase2026
      POSTGRES_DB: arcturus
    volumes:
      - pg_data:/var/lib/postgresql/data
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "LegoRedis2026"]
    volumes:
      - redis_data:/data
    logging: *default-logging

  api:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://arcturus:LegoDatabase2026@postgres:5432/arcturus?schema=public
      - REDIS_URL=redis://:LegoRedis2026@redis:6379
    # Чекаємо 15 сек на ініціалізацію БД, потім пушимо таблиці
    command: sh -c "sleep 15 && npx prisma db push --schema=/app/packages/db/prisma/schema.prisma --accept-data-loss && node $$(find dist -name main.js | head -n 1)"
    depends_on:
      - postgres
      - redis
    logging: *default-logging

  workers:
    build:
      context: ./backend
      dockerfile: apps/workers/Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://arcturus:LegoDatabase2026@postgres:5432/arcturus?schema=public
      - REDIS_URL=redis://:LegoRedis2026@redis:6379
    # Чекаємо 25 сек, щоб API встигло створити всі таблиці
    command: sh -c "sleep 25 && node $$(find dist -name main.js | head -n 1)"
    depends_on:
      - postgres
      - redis
    logging: *default-logging

  scrapers:
    build:
      context: ./backend
      dockerfile: apps/scrapers/Dockerfile
    restart: always
    shm_size: '1gb'
    environment:
      - DATABASE_URL=postgresql://arcturus:LegoDatabase2026@postgres:5432/arcturus?schema=public
      - REDIS_URL=redis://:LegoRedis2026@redis:6379
    # Чекаємо 25 сек
    command: sh -c "sleep 25 && node $$(find dist -name scraper-loop.js | head -n 1)"
    depends_on:
      - postgres
      - redis
    logging: *default-logging

volumes:
  redis_data:
  pg_data: