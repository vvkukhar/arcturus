version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: arcturus
      POSTGRES_PASSWORD: ${DB_PASSWORD:-LegoDatabase2026}
      POSTGRES_DB: arcturus
    volumes:
      - arcturus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcturus -d arcturus"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-LegoRedis2026}"]
    volumes:
      - arcturus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-LegoRedis2026}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  api:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "4000:4000"
    # 🔥 ФІКС: Створюємо таблиці в новій базі перед запуском сервера
    command: sh -c "npx prisma db push --schema=packages/db/prisma/schema.prisma --accept-data-loss && node $$(find dist -name main.js | head -n 1)"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  workers:
    build:
      context: ./backend
      dockerfile: apps/workers/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  scrapers:
    build:
      context: ./backend
      dockerfile: apps/scrapers/Dockerfile
    restart: always
    shm_size: '1gb'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

volumes:
  arcturus_redis_data:
  arcturus_pg_data: