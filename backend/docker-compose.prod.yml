version: '3.9'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: arcturus_postgres
    restart: always
    env_file: .env.production
    volumes:
      - arcturus_pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 3
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: arcturus_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - arcturus_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    logging: *default-logging

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: arcturus_api
    restart: always
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    command: sh -c "npx prisma generate && npx prisma migrate deploy && node dist/main.js"
    logging: *default-logging

  workers:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: arcturus_workers
    restart: always
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma generate && node dist/main.js"
    logging: *default-logging

volumes:
  arcturus_pg_data:
  arcturus_redis_data: