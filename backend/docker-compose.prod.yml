x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "10"

services:
  postgres:
    image: postgres:16-alpine
    container_name: arcturus_postgres
    restart: always
    env_file: .env.production
    command: 
      - "postgres"
      - "-c"
      - "max_connections=1000"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "default_statistics_target=100"
    volumes:
      - arcturus_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    container_name: arcturus_redis
    restart: always
    command: 
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "${REDIS_PASSWORD}"
      - "--maxmemory"
      - "2gb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--tcp-keepalive"
      - "300"
    volumes:
      - arcturus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  api:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    container_name: arcturus_api
    restart: always
    env_file: ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    command: sh -c "npx prisma generate && npx prisma migrate deploy && node apps/api/dist/src/main.js"
    logging: *default-logging

  workers:
    build:
      context: ./backend
      dockerfile: apps/workers/Dockerfile
    container_name: arcturus_workers
    restart: always
    env_file: ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "node apps/workers/dist/main.js"
    deploy:
      resources:
        limits:
          memory: 2G
    logging: *default-logging

  scrapers:
    build:
      context: ./backend
      dockerfile: apps/scrapers/Dockerfile
    container_name: arcturus_scrapers
    restart: always
    env_file: ./backend/.env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "node apps/scrapers/dist/scraper-loop.js"
    deploy:
      resources:
        limits:
          memory: 4G
    logging: *default-logging

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: arcturus_web
    restart: always
    env_file: ./web/.env.production
    depends_on:
      - api
    ports:
      - "3000:3000"
    logging: *default-logging

volumes:
  arcturus_pg_data:
  arcturus_redis_data: