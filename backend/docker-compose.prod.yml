version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: arcturus_postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - arcturus_pg_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: arcturus_redis
    restart: unless-stopped
    volumes:
      - arcturus_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: arcturus_api
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "127.0.0.1:4000:4000"
    command: sh -c "npx prisma generate && npx prisma migrate deploy && node dist/main.js"

  workers:
    build:
      context: ./workers
      dockerfile: Dockerfile
    container_name: arcturus_workers
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "npx prisma generate && node dist/main.js"

volumes:
  arcturus_pg_data:
  arcturus_redis_data: