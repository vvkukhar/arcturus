version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: arcturus
      POSTGRES_PASSWORD: LegoDatabase2026
      POSTGRES_DB: arcturus
    volumes:
      - pg_data_v10:/var/lib/postgresql/data
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "LegoRedis2026"]
    volumes:
      - redis_data_v10:/data
    logging: *default-logging

  api:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    restart: always
    expose:
      - "4000"
    environment:
      - DATABASE_URL=postgresql://arcturus:LegoDatabase2026@postgres:5432/arcturus?schema=public
      - REDIS_URL=redis://:LegoRedis2026@redis:6379
      - NODE_ENV=development
      - PORT=4000
    # Безкінечний цикл доки не створить таблиці, потім запуск
    command: sh -c "until npx prisma db push --schema=/app/packages/db/prisma/schema.prisma --accept-data-loss; do echo 'Waiting for DB...'; sleep 5; done; echo 'DB Ready!'; node $$(find dist -name main.js | head -n 1)"
    depends_on:
      - postgres
      - redis
    logging: *default-logging

  workers:
    build:
      context: ./backend
      dockerfile: apps/workers/Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://arcturus:LegoDatabase2026@postgres:5432/arcturus?schema=public
      - REDIS_URL=redis://:LegoRedis2026@redis:6379
      - NODE_ENV=production
    # Жорстко чекаємо 45 секунд, поки API накотить міграції
    command: sh -c "sleep 45 && node $$(find dist -name main.js | head -n 1)"
    depends_on:
      - postgres
      - redis
      - api
    logging: *default-logging

  scrapers:
    build:
      context: ./backend
      dockerfile: apps/scrapers/Dockerfile
    restart: always
    shm_size: '1gb'
    environment:
      - DATABASE_URL=postgresql://arcturus:LegoDatabase2026@postgres:5432/arcturus?schema=public
      - REDIS_URL=redis://:LegoRedis2026@redis:6379
      - NODE_ENV=production
    # Жорстко чекаємо 45 секунд
    command: sh -c "sleep 45 && node $$(find dist -name scraper-loop.js | head -n 1)"
    depends_on:
      - postgres
      - redis
      - api
    logging: *default-logging

volumes:
  redis_data_v10:
  pg_data_v10: