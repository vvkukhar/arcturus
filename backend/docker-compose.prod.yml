version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  redis:
    image: redis:7-alpine
    container_name: arcturus_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - arcturus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: arcturus_api
    restart: always
    ports:
      - "4000:4000"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  workers:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    container_name: arcturus_workers
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

  scrapers:
    build:
      context: .
      dockerfile: apps/scrapers/Dockerfile
    container_name: arcturus_scrapers
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging

volumes:
  arcturus_redis_data: