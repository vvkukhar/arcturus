version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: arcturus
      # Жорстко фіксуємо пароль, щоб уникнути багів Coolify
      POSTGRES_PASSWORD: LegoDatabase2026
      POSTGRES_DB: arcturus
    volumes:
      - arcturus_pg_data_v3:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcturus -d arcturus"]
      interval: 2s
      timeout: 5s
      retries: 30
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "LegoRedis2026"]
    volumes:
      - arcturus_redis_data_v2:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "LegoRedis2026", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
    logging: *default-logging

  api:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "4000:4000"
    command: sh -c "npx prisma db push --schema=packages/db/prisma/schema.prisma --accept-data-loss && node $$(find dist -name main.js | head -n 1)"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  workers:
    build:
      context: ./backend
      dockerfile: apps/workers/Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  scrapers:
    build:
      context: ./backend
      dockerfile: apps/scrapers/Dockerfile
    restart: always
    shm_size: '1gb'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

volumes:
  arcturus_redis_data_v2:
  arcturus_pg_data_v3: