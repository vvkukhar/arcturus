version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: arcturus
      POSTGRES_PASSWORD: LegoDatabase2026
      POSTGRES_DB: arcturus
    volumes:
      - arcturus_pg_data_v5:/var/lib/postgresql/data
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "LegoRedis2026"]
    volumes:
      - arcturus_redis_data_v4:/data
    logging: *default-logging

  api:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    restart: always
    ports:
      - "4000:4000"
    # 🔥 ФІКС: Абсолютний шлях до схеми + очікування 10 сек поки підніметься БД
    command: sh -c "sleep 10 && npx prisma db push --schema=/app/packages/db/prisma/schema.prisma --accept-data-loss && node $$(find dist -name main.js | head -n 1)"
    depends_on:
      - postgres
      - redis
    logging: *default-logging

  workers:
    build:
      context: ./backend
      dockerfile: apps/workers/Dockerfile
    restart: always
    depends_on:
      - postgres
      - redis
    logging: *default-logging

  scrapers:
    build:
      context: ./backend
      dockerfile: apps/scrapers/Dockerfile
    restart: always
    shm_size: '1gb'
    depends_on:
      - postgres
      - redis
    logging: *default-logging

volumes:
  arcturus_redis_data_v4:
  arcturus_pg_data_v5: