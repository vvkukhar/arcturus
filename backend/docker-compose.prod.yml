version: '3.8'

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: arcturus
      POSTGRES_PASSWORD: LegoDatabase2026
      POSTGRES_DB: arcturus
    volumes:
      - pg_data_v9:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcturus -d arcturus"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "LegoRedis2026"]
    volumes:
      - redis_data_v9:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "LegoRedis2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  api:
    build:
      context: ./backend
      dockerfile: apps/api/Dockerfile
    restart: always
    expose:
      - "4000" # Тільки expose, жодних ports! Це звільнить сервер від конфліктів.
    environment:
      - DATABASE_URL=postgresql://arcturus:LegoDatabase2026@postgres:5432/arcturus?schema=public
      - REDIS_URL=redis://:LegoRedis2026@redis:6379
      - NODE_ENV=development # Вмикаємо логи, щоб бачити кожен крок
      - PORT=4000
    command: sh -c "npx prisma db push --schema=/app/packages/db/prisma/schema.prisma --accept-data-loss && node $$(find dist -name main.js | head -n 1)"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  workers:
    build:
      context: ./backend
      dockerfile: apps/workers/Dockerfile
    restart: always
    environment:
      - DATABASE_URL=postgresql://arcturus:LegoDatabase2026@postgres:5432/arcturus?schema=public
      - REDIS_URL=redis://:LegoRedis2026@redis:6379
      - NODE_ENV=production
    command: sh -c "node $$(find dist -name main.js | head -n 1)"
    depends_on:
      api:
        condition: service_healthy # Чекає, поки API повністю підніметься!
    logging: *default-logging

  scrapers:
    build:
      context: ./backend
      dockerfile: apps/scrapers/Dockerfile
    restart: always
    shm_size: '1gb'
    environment:
      - DATABASE_URL=postgresql://arcturus:LegoDatabase2026@postgres:5432/arcturus?schema=public
      - REDIS_URL=redis://:LegoRedis2026@redis:6379
      - NODE_ENV=production
    command: sh -c "node $$(find dist -name scraper-loop.js | head -n 1)"
    depends_on:
      api:
        condition: service_healthy # Чекає, поки API повністю підніметься!
    logging: *default-logging

volumes:
  redis_data_v9:
  pg_data_v9: