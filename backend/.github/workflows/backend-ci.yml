name: Backend CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  api:
    name: API build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: arcturus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arcturus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: backend/api

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arcturus_test
      ADMIN_TOKEN: supersecret
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      CORS_ORIGIN: http://localhost:3000
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/api/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Push schema
        run: npx prisma db push

      - name: Seed
        run: npm run seed

      - name: Build
        run: npm run build

      - name: Export OpenAPI
        run: npm run openapi:export

  workers:
    name: Workers build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend/workers

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/arcturus_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/workers/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Build
        run: npm run build