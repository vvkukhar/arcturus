name: Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker:
    name: Build Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -t arcturus-api:ci ./backend/api

      - name: Build Workers image
        run: docker build -t arcturus-workers:ci ./backend/workers