limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=api_burst:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

upstream arcturus_api {
    server 127.0.0.1:4000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

server {
    listen 80 backlog=4096;
    server_name api.arcturus.local;

    client_max_body_size 50M;
    client_body_buffer_size 256k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    server_tokens off;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;

    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location /api/ {
        limit_req zone=api_limit burst=100 nodelay;
        limit_conn addr_limit 50;
        
        proxy_pass http://arcturus_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 16 32k;
        proxy_busy_buffers_size 64k;
    }

    location /socket.io/ {
        limit_req zone=api_burst burst=200 nodelay;
        
        proxy_pass http://arcturus_api/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}