# backend/render.yaml
services:
  - type: redis
    name: arcturus-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: web
    name: arcturus-api
    env: docker
    region: frankfurt
    plan: starter
    rootDir: .
    dockerfilePath: ./apps/api/Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: arcturus-redis
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: arcturus-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: arcturus-redis
          property: port
      - key: REDIS_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_STORE_BASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: LIQPAY_PUBLIC_KEY
        sync: false
      - key: LIQPAY_PRIVATE_KEY
        sync: false
      - key: MONOBANK_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  - type: worker
    name: arcturus-workers
    env: docker
    region: frankfurt
    plan: starter
    rootDir: .
    dockerfilePath: ./apps/workers/Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: arcturus-api
          envVarKey: DATABASE_URL
      - key: DIRECT_URL
        fromService:
          type: web
          name: arcturus-api
          envVarKey: DIRECT_URL
      - key: REDIS_URL
        fromService:
          type: redis
          name: arcturus-redis
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: TELEGRAM_BOT_TOKEN
        fromService:
          type: web
          name: arcturus-api
          envVarKey: TELEGRAM_BOT_TOKEN
      - key: TELEGRAM_CHAT_ID
        fromService:
          type: web
          name: arcturus-api
          envVarKey: TELEGRAM_CHAT_ID

  - type: worker
    name: arcturus-scrapers
    env: docker
    region: frankfurt
    plan: starter
    rootDir: .
    dockerfilePath: ./apps/scrapers/Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: arcturus-api
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: redis
          name: arcturus-redis
          property: connectionString
      - key: SCRAPER_INTERVAL_MS
        value: "1200000"
      - key: PROXY_LIST
        sync: false