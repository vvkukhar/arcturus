services:
  - type: web
    name: arcturus-api
    env: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./apps/api/Dockerfile
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_BOOTSTRAP_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: arcturus-bullmq-workers
    env: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./apps/workers/Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: arcturus-api
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: web
          name: arcturus-api
          envVarKey: REDIS_URL

  - type: worker
    name: arcturus-scrapers
    env: docker
    plan: starter
    rootDir: backend
    dockerfilePath: ./apps/scrapers/Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: arcturus-api
          envVarKey: DATABASE_URL
      - key: SCRAPER_INTERVAL_MS
        value: "1200000"