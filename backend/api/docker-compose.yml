services:
  postgres:
    image: postgres:16-alpine
    container_name: arcturus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: arcturus
      POSTGRES_PASSWORD: arcturus_password
      POSTGRES_DB: arcturus
    ports:
      - "5432:5432"
    volumes:
      - arcturus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcturus -d arcturus"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: arcturus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - arcturus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arcturus-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4000:4000"

volumes:
  arcturus_postgres_data:
  arcturus_redis_data: