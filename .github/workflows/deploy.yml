name: Arcturus Production CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-backend:
    name: Build & Check Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend/packages/db
        run: npx prisma generate

      - name: Build Monorepo
        working-directory: ./backend
        run: npm run build:all

  validate-web:
    name: Build & Check Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Next.js Build
        working-directory: ./web
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:4000/api"

  deploy-render:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: [validate-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Webhook
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_API }}
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_WORKERS }}